<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">双通道转向架构与故障降级</title>
  <desc id="desc">主通道失效后，独立健康判断将执行权交给热备通道，无法维持能力时进入MRM。</desc>
  <rect width="1200" height="700" fill="#eef4f5"/>
  <g opacity=".55" stroke="#d2cfc4" stroke-width="1">
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200M0 600H1200"/>
    <path d="M100 0V700M200 0V700M300 0V700M400 0V700M500 0V700M600 0V700M700 0V700M800 0V700M900 0V700M1000 0V700M1100 0V700"/>
  </g>
  <g transform="translate(70 88)">
    <text x="0" y="0" fill="#244653" font-family="Cascadia Mono, Consolas, monospace" font-size="13" letter-spacing="3">FAIL-OPERATIONAL / STEERING</text>
    <text x="0" y="34" fill="#707777" font-family="Microsoft YaHei, sans-serif" font-size="14">单通道失效后，系统只允许降级运行或进入最小风险状态。</text>
  </g>
  <g font-family="Microsoft YaHei, sans-serif">
    <g transform="translate(72 190)">
      <rect width="210" height="126" fill="#274955"/>
      <text x="20" y="34" fill="#aebfc0" font-family="Cascadia Mono, Consolas, monospace" font-size="10">A / PRIMARY</text>
      <text x="20" y="68" fill="#f8f5ed" font-size="20">主控制通道</text>
      <text x="20" y="94" fill="#c8d1cf" font-size="12">指令闭环 · 实际转角 · 电流</text>
      <circle cx="182" cy="101" r="8" fill="#bd654b"/>
    </g>
    <g transform="translate(72 352)">
      <rect width="210" height="126" fill="#e1e4dc" stroke="#9ba49d"/>
      <text x="20" y="34" fill="#6b7472" font-family="Cascadia Mono, Consolas, monospace" font-size="10">B / HOT STANDBY</text>
      <text x="20" y="68" fill="#244653" font-size="20">热备控制通道</text>
      <text x="20" y="94" fill="#657170" font-size="12">受控输出 · 自检 · 待授权</text>
    </g>
    <g transform="translate(382 190)">
      <rect width="212" height="288" fill="#fbfaf5" stroke="#a8afa8"/>
      <text x="22" y="36" fill="#80503d" font-family="Cascadia Mono, Consolas, monospace" font-size="10">INDEPENDENT MONITOR</text>
      <text x="22" y="72" fill="#244653" font-size="20">独立健康判断</text>
      <path d="M22 102H190M22 132H190M22 162H190M22 192H150" stroke="#d4d1c7"/>
      <text x="22" y="122" fill="#67716f" font-size="12">时间戳 / 新鲜度</text>
      <text x="22" y="152" fill="#67716f" font-size="12">指令 / 角度一致性</text>
      <text x="22" y="182" fill="#67716f" font-size="12">车辆横摆与响应</text>
      <text x="22" y="220" fill="#8f4d39" font-size="12">未知状态 → 不授权 NORMAL</text>
      <rect x="22" y="242" width="168" height="28" fill="#eee4dc"/>
      <text x="34" y="261" fill="#80503d" font-size="11">2oo2 合理性判断</text>
    </g>
    <g transform="translate(694 190)">
      <rect width="204" height="126" fill="#d7dccf"/>
      <text x="20" y="34" fill="#5b6860" font-family="Cascadia Mono, Consolas, monospace" font-size="10">ARBITRATION</text>
      <text x="20" y="68" fill="#244653" font-size="20">锁存式仲裁</text>
      <text x="20" y="94" fill="#5f6c67" font-size="12">降级后不自动返回</text>
    </g>
    <g transform="translate(694 352)">
      <rect width="204" height="126" fill="#b9674c"/>
      <text x="20" y="34" fill="#f0ded5" font-family="Cascadia Mono, Consolas, monospace" font-size="10">MRM / FALLBACK</text>
      <text x="20" y="68" fill="#fffaf2" font-size="20">最小风险机动</text>
      <text x="20" y="94" fill="#f5e4db" font-size="12">禁增扭 · 减速 · 驻车</text>
    </g>
    <g transform="translate(990 210)">
      <rect width="138" height="236" fill="#17343e"/>
      <text x="20" y="36" fill="#9eb1b2" font-family="Cascadia Mono, Consolas, monospace" font-size="9">OUTPUT</text>
      <text x="20" y="75" fill="#f8f5ed" font-size="18">可控运动</text>
      <path d="M20 96H116" stroke="#718a8c"/>
      <text x="20" y="126" fill="#c2cdca" font-size="12">路径连续</text>
      <text x="20" y="154" fill="#c2cdca" font-size="12">速度受限</text>
      <text x="20" y="182" fill="#c2cdca" font-size="12">状态可追溯</text>
    </g>
  </g>
  <g fill="none" stroke="#819192" stroke-width="2">
    <path d="M282 253H382M282 415H382M594 334H694"/>
    <path d="M796 253V352"/>
    <path d="M898 415H990"/>
  </g>
  <g fill="#8f4d39">
    <path d="M374 247L388 253L374 259Z"/>
    <path d="M374 409L388 415L374 421Z"/>
    <path d="M686 328L700 334L686 340Z"/>
    <path d="M982 409L996 415L982 421Z"/>
  </g>
</svg>
