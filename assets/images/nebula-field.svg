<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">深青绿色科技星云背景</title>
  <desc id="desc">用于课程首页和作业页首屏的低饱和星云、光晕、星点和运动轨迹背景。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#041113"/>
      <stop offset=".52" stop-color="#0a2726"/>
      <stop offset="1" stop-color="#07191f"/>
    </linearGradient>
    <radialGradient id="glow-green">
      <stop offset="0" stop-color="#88f1b3" stop-opacity=".52"/>
      <stop offset=".35" stop-color="#2db98b" stop-opacity=".22"/>
      <stop offset="1" stop-color="#136a64" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-blue">
      <stop offset="0" stop-color="#83d9db" stop-opacity=".28"/>
      <stop offset=".6" stop-color="#27747d" stop-opacity=".08"/>
      <stop offset="1" stop-color="#102a34" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-large" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>
    <filter id="blur-small" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="1150" cy="170" rx="540" ry="360" fill="url(#glow-green)" filter="url(#blur-large)"/>
  <ellipse cx="500" cy="690" rx="510" ry="300" fill="url(#glow-blue)" filter="url(#blur-large)"/>
  <ellipse cx="820" cy="350" rx="360" ry="210" fill="url(#glow-green)" filter="url(#blur-small)" opacity=".42"/>
  <g fill="none" stroke="#9ae6c0" opacity=".2">
