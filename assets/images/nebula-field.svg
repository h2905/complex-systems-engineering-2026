    <circle cx="1448" cy="166" r="1.2" opacity=".46"/>
    <circle cx="1540" cy="326" r="2" opacity=".58"/>
    <circle cx="254" cy="462" r="1.5" opacity=".4"/>
    <circle cx="412" cy="558" r="1.8" opacity=".44"/>
    <circle cx="594" cy="468" r="1.2" opacity=".35"/>
    <circle cx="748" cy="612" r="1.4" opacity=".4"/>
