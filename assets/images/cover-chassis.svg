<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc">
  <title id="title">线控底盘平台运动控制示意</title>
  <desc id="desc">车辆俯视示意，自动驾驶意图经底盘平台分配到四类执行器，并返回状态。</desc>
  <rect width="720" height="1000" fill="#17343e"/>
  <g opacity=".13" stroke="#b8c7c8" stroke-width="1">
    <path d="M0 100H720M0 200H720M0 300H720M0 400H720M0 500H720M0 600H720M0 700H720M0 800H720M0 900H720"/>
    <path d="M100 0V1000M200 0V1000M300 0V1000M400 0V1000M500 0V1000M600 0V1000"/>
  </g>
  <g fill="#f2eee3" font-family="Microsoft YaHei, sans-serif">
    <text x="72" y="92" font-size="16" letter-spacing="3">MOTION / PLATFORM</text>
    <text x="72" y="128" font-size="12" opacity=".55">INTENT → ARBITRATION → ACTUATION → STATE</text>
  </g>
  <g transform="translate(0 130)">
    <rect x="150" y="270" width="420" height="365" rx="118" fill="none" stroke="#d5d9d2" stroke-width="2"/>
    <rect x="203" y="344" width="314" height="220" rx="65" fill="none" stroke="#8fa5a8" stroke-width="1.5"/>
    <g fill="#1f4551" stroke="#d4dbd6" stroke-width="2">
      <rect x="104" y="305" width="62" height="112" rx="18"/>
      <rect x="554" y="305" width="62" height="112" rx="18"/>
      <rect x="104" y="494" width="62" height="112" rx="18"/>
      <rect x="554" y="494" width="62" height="112" rx="18"/>
    </g>
    <g fill="none" stroke-width="2">
      <path d="M166 361H265M455 361H554" stroke="#72a5a8"/>
      <path d="M166 550H265M455 550H554" stroke="#9f8865"/>
    </g>
    <rect x="300" y="397" width="120" height="104" rx="8" fill="#e8e4d8"/>
    <path d="M325 422H395M325 441H395M325 460H372" stroke="#284b58" stroke-width="4" stroke-linecap="round"/>
    <circle cx="360" cy="480" r="5" fill="#98543e"/>
    <g fill="#f1ede3" font-family="Microsoft YaHei, sans-serif" font-size="11">
      <text x="74" y="289">AD REQUEST</text>
      <text x="275" y="380">MOTION CORE</text>
      <text x="588" y="289">STEER A/B</text>
      <text x="600" y="558">BRAKE</text>
      <text x="63" y="558">DRIVE</text>
    </g>
    <g fill="none" stroke="#d7ddd8" stroke-width="1.5">
      <path d="M257 418H300" stroke-dasharray="5 6"/>
      <path d="M420 418H463" stroke-dasharray="5 6"/>
      <path d="M360 501V550" stroke-dasharray="5 6"/>
    </g>
  </g>
  <g transform="translate(72 790)">
    <text x="0" y="0" fill="#e7e3d8" font-family="Microsoft YaHei, sans-serif" font-size="13">运行状态</text>
    <g font-family="Cascadia Mono, Consolas, monospace" font-size="11">
      <rect x="0" y="22" width="132" height="42" fill="#d9decf"/>
      <text x="18" y="48" fill="#17343e">NORMAL</text>
      <rect x="146" y="22" width="148" height="42" fill="#c8a36a"/>
      <text x="164" y="48" fill="#17343e">DEGRADED</text>
      <rect x="308" y="22" width="112" height="42" fill="#b9654b"/>
      <text x="326" y="48" fill="#fffaf0">MRM</text>
      <rect x="434" y="22" width="132" height="42" fill="none" stroke="#778b8d"/>
      <text x="452" y="48" fill="#dce2dd">SAFE STOP</text>
    </g>
  </g>
  <g transform="translate(72 920)" fill="none" stroke="#8ba0a1" stroke-width="1">
    <path d="M0 0H576"/>
    <circle cx="0" cy="0" r="4" fill="#b9654b" stroke="none"/>
    <circle cx="576" cy="0" r="4" fill="#c8a36a" stroke="none"/>
  </g>
</svg>
